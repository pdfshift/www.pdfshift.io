# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  # 1. Regenerates public/llms.txt and public/llms-full.txt from content/ (before nuxt generate copies public/)
  # 2. Builds the site
  # 3. Fails the build (and so the deploy) if pages disappear from the sitemap, see scripts/check-sitemap.mjs
  command = "node scripts/gen-llms.mjs && nuxt generate && node scripts/check-sitemap.mjs"

# Link headers edge function
[[edge_functions]]
function = "link-headers"
path = "/*"

# Markdown negotiation edge function
# Use markdown-negotiation-simple for pre-generated markdown only (more reliable)
# Use markdown-negotiation for full HTML conversion (requires external deps)
[[edge_functions]]
function = "markdown-negotiation"
path = "/*"
excludedPath = [
    "/_nuxt/*",
    "/images/*",
    "/js/*",
    "/documents/*",
    "/.well-known/*",
    "/.netlify/*",
    "/content/*",
    "/*.js",
    "/*.css",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.svg",
    "/*.ico",
    "/*.woff",
    "/*.woff2",
    "/*.ttf",
    "/*.eot",
    "/*.webp",
    "/*.gif",
    "/*.pdf",
    "/*.zip",
    "/*.json",
    "/*.xml"
]
